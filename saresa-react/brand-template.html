  <script>
    (function () {
      function isHomePath(pathname) {
        return pathname === "/" || /\/index\.html$/i.test(pathname);
      }

      function cleanHash() {
        if (window.location.hash && window.history.replaceState) {
          window.history.replaceState(null, "", window.location.pathname + window.location.search);
        }
      }

      function scrollToTarget(id) {
        var target = document.getElementById(id);
        if (target) {
          target.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      }

      cleanHash();

      document.addEventListener("click", function (event) {
        var link = event.target.closest ? event.target.closest("a[data-scroll-target]") : null;
        if (!link) {
          return;
        }
        var targetId = link.getAttribute("data-scroll-target");
        if (!targetId) {
          return;
        }
        if (isHomePath(window.location.pathname)) {
          event.preventDefault();
          scrollToTarget(targetId);
          if (window.history.replaceState) {
            window.history.replaceState(null, "", "/");
          }
        } else {
          try {
            window.sessionStorage.setItem("sindhScrollTarget", targetId);
          } catch (error) {}
        }
      });

      document.addEventListener("DOMContentLoaded", function () {
        var targetId = null;
        try {
          targetId = window.sessionStorage.getItem("sindhScrollTarget");
          window.sessionStorage.removeItem("sindhScrollTarget");
        } catch (error) {}
        if (targetId && isHomePath(window.location.pathname)) {
          window.setTimeout(function () {
            scrollToTarget(targetId);
          }, 100);
        }
      });
    })();
  </script>

  <body class="brand-page">
<div id="brand-root">{{APP}}</div>
<script>
    (function () {
      document.addEventListener("DOMContentLoaded", function () {
        var widget = document.getElementById("whatsappWidget");
        if (!widget) {
          return;
        }
        var dismiss = widget.querySelector("[data-whatsapp-dismiss]");
        var toggle = widget.querySelector("[data-whatsapp-toggle]");
        var autoCloseTimer = null;

        function clearAutoClose() {
          if (autoCloseTimer) {
            window.clearTimeout(autoCloseTimer);
            autoCloseTimer = null;
          }
        }

        function setOpen(isOpen) {
          clearAutoClose();
          widget.classList.toggle("is-open", isOpen);
          if (toggle) {
            toggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
          }
          if (isOpen) {
            autoCloseTimer = window.setTimeout(function () {
              setOpen(false);
            }, 2000);
          }
        }

        if (toggle) {
          toggle.addEventListener("click", function (event) {
            if (!widget.classList.contains("is-open")) {
              event.preventDefault();
              setOpen(true);
            }
          });
        }

        if (dismiss) {
          dismiss.addEventListener("click", function () {
            setOpen(false);
          });
        }

        document.addEventListener("click", function (event) {
          if (widget.classList.contains("is-open") && !widget.contains(event.target)) {
            setOpen(false);
          }
        });

        document.addEventListener("keydown", function (event) {
          if (event.key === "Escape") {
            setOpen(false);
          }
        });
      });
    })();
  </script>
<script>
      (function () {
        document.addEventListener(
          "click",
          function (event) {
            var link = event.target.closest
              ? event.target.closest("a[data-direct-brand-link]")
              : null;
            if (!link) {
              return;
            }
            var href = link.getAttribute("href");
            if (!href) {
              return;
            }
            event.preventDefault();
            event.stopPropagation();
            window.location.href = href;
          },
          true,
        );
      })();

      (function () {
        var menuTrigger = document.getElementById("menuTrigger");
        var menuPanel = document.getElementById("menuPanel");
        var menuContent = menuPanel
          ? menuPanel.querySelector(".menu-content")
          : null;
        var menuText = menuTrigger
          ? menuTrigger.querySelector(".menu-text")
          : null;

        if (!menuTrigger || !menuPanel) {
          return;
        }

        function openMenu() {
          menuPanel.hidden = false;
          menuTrigger.setAttribute("aria-expanded", "true");
          menuTrigger.setAttribute("aria-label", "Close menu");
          if (menuText) {
            menuText.textContent = "CLOSE";
          }
          document.body.classList.add("menu-open");
        }

        function closeMenu() {
          menuPanel.hidden = true;
          menuTrigger.setAttribute("aria-expanded", "false");
          menuTrigger.setAttribute("aria-label", "Open menu");
          if (menuText) {
            menuText.textContent = "MENU";
          }
          document.body.classList.remove("menu-open");
        }

        menuTrigger.addEventListener("click", function () {
          var isExpanded = menuTrigger.getAttribute("aria-expanded") === "true";
          if (isExpanded) {
            closeMenu();
            return;
          }
          openMenu();
        });

        document.addEventListener("click", function (event) {
          var target = event.target;
          if (menuPanel.hidden) {
            return;
          }
          if (menuTrigger.contains(target)) {
            return;
          }
          if (menuContent && menuContent.contains(target)) {
            return;
          }
          closeMenu();
        });

        document.addEventListener("keydown", function (event) {
          if (event.key === "Escape") {
            closeMenu();
          }
        });

        Array.prototype.forEach.call(
          menuPanel.querySelectorAll("a"),
          function (link) {
            link.addEventListener("click", closeMenu);
          },
        );
      })();

      (function () {
        var socialLinks = document.querySelectorAll(
          '.social-icons a[target="_blank"]',
        );
        if (!socialLinks.length) {
          return;
        }

        Array.prototype.forEach.call(socialLinks, function (link) {
          link.addEventListener("click", function (event) {
            var newWindow = window.open(link.href, "_blank", "noopener");
            if (newWindow) {
              newWindow.opener = null;
              event.preventDefault();
            }
          });
        });
      })();
    </script>
<script>
    (function () {
      document.addEventListener("DOMContentLoaded", function () {
        var dropdownItems = document.querySelectorAll(".main-nav .nav-item--has-dropdown");
        if (!dropdownItems.length) {
          return;
        }

        function setOpen(item, isOpen) {
          var trigger = item.querySelector("a[aria-haspopup='true']");
          item.classList.toggle("is-open", isOpen);
          if (trigger) {
            trigger.setAttribute("aria-expanded", isOpen ? "true" : "false");
          }
        }

        function closeAll(exceptItem) {
          Array.prototype.forEach.call(dropdownItems, function (item) {
            if (item !== exceptItem) {
              setOpen(item, false);
            }
          });
        }

        Array.prototype.forEach.call(dropdownItems, function (item) {
          var trigger = item.querySelector("a[aria-haspopup='true']");
          if (!trigger) {
            return;
          }

          trigger.addEventListener("click", function (event) {
            event.preventDefault();
            var willOpen = !item.classList.contains("is-open");
            closeAll(item);
            setOpen(item, willOpen);
          });

          trigger.addEventListener("focus", function () {
            closeAll(item);
            setOpen(item, true);
          });
        });

        document.addEventListener("click", function (event) {
          if (!event.target.closest || !event.target.closest(".main-nav .nav-item--has-dropdown")) {
            closeAll();
          }
        });

        document.addEventListener("keydown", function (event) {
          if (event.key === "Escape") {
            closeAll();
          }
        });
      });
    })();
  </script>
<script>
(function(){
  var items=document.querySelectorAll('#brand-root .luxury-card[data-reveal]');
  var reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
  function showAll(){items.forEach(function(el){el.classList.remove('reveal-pending');el.classList.add('is-visible');});}
  if(reduced.matches || !('IntersectionObserver' in window)){showAll();return;}
  var observer=new IntersectionObserver(function(entries){
    var stagger=0;
    entries.forEach(function(entry){
      if(!entry.isIntersecting)return;
      entry.target.style.setProperty('--brand-delay',stagger*80+'ms');
      entry.target.classList.add('is-visible');
      observer.unobserve(entry.target);
      stagger++;
    });
  },{threshold:0.12});
  items.forEach(function(el){el.classList.add('reveal-pending');observer.observe(el);});
  document.addEventListener('focusin',function(event){
    var card=event.target.closest('#brand-root .luxury-card');
    if(card){card.style.setProperty('--brand-delay','0ms');card.classList.add('is-visible');observer.unobserve(card);}
  });
  reduced.addEventListener('change',function(){if(reduced.matches){observer.disconnect();showAll();}});
})();
</script>
