    <style>
      .saresa-slider { position: relative; width: 100%; margin: 2rem auto 0; }
      .saresa-slider__viewport { overflow: hidden; background: #fff; touch-action: pan-y; }
      .saresa-slider__track { display: flex; width: max-content; gap: clamp(6px, 1.2vw, 14px); padding-right: clamp(6px, 1.2vw, 14px); }
      .saresa-slider__slide { position: relative; flex: 0 0 auto; width: clamp(260px, 32vw, 540px); }
      .saresa-slider__slide img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 5; object-fit: contain; background: #f4eee7; border-radius: 4px; }
      .saresa-slider__slide--catalog::after { content: ""; position: absolute; inset: 0; z-index: 1; border-radius: 4px; background: rgb(35 25 19 / 22%); pointer-events: none; }
      .saresa-slider__view-more { position: absolute; left: 50%; bottom: 1rem; transform: translateX(-50%); display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0.65rem 1.25rem; border: 1px solid #fff; border-radius: 2px; background: rgb(35 25 19 / 82%); color: #fff; font-size: 0.82rem; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none; white-space: nowrap; }
      .saresa-slider__slide--catalog .saresa-slider__view-more { z-index: 2; bottom: 50%; transform: translate(-50%, 50%); }
      .basanti-slider .saresa-slider__view-more { z-index: 2; left: 50%; bottom: 1rem; width: auto; min-height: 38px; padding: 0.45rem 0.9rem; transform: translateX(-50%); border-color: rgb(255 255 255 / 55%); background: rgb(24 20 18 / 48%); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); font-size: 0.72rem; letter-spacing: 0.1em; }
      .saresa-slider__view-more:hover { background: #fff; color: #231913; }
      .saresa-slider__arrow svg { fill: none; stroke: currentColor; stroke-width: 1.8; filter: drop-shadow(0 1px 2px #0009); }
      .saresa-slider button:focus-visible { outline: 3px solid #9b7b55; outline-offset: 3px; }
      @media (max-width: 640px) { .saresa-slider { margin-top: 1rem; } }
      .saresa-story { max-width:1400px; margin:0 auto; padding:clamp(32px,5vw,80px) clamp(20px,4vw,64px); display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); align-items:start; gap:clamp(32px,6vw,100px); background:#fff; }
      .saresa-story__logo { display:block; width:300px; max-width:100%; height:250px; object-fit:contain; object-position:center; margin:0 auto; grid-column:1/-1; justify-self:center; }
      .basanti-brand-heading { grid-column:1/-1; display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:12px; }
      .basanti-brand-heading .saresa-story__logo { grid-column:auto; justify-self:auto; margin:0 auto; }
      .saresa-story__contacts { display:grid; grid-template-columns:1fr; gap:32px 20px; margin:0; }
      .saresa-story__contact { display:flex; align-items:center; gap:12px; font-size:14px; color:#000; background:none; line-height:1.5; }
      .saresa-story__contact > span:last-child { min-width:0; white-space:nowrap; }
      .saresa-story__share summary { cursor:pointer; list-style:none; }
      .saresa-story__share summary::-webkit-details-marker { display:none; }
      .saresa-story__social { display:flex; flex-direction:column; gap:8px; margin:16px 0 0 66px; }
      .saresa-story__social a { display:block; padding:10px 12px; color:#000; background:#fff; border:1px solid #000; font-size:14px; }
      .saresa-story__social a:hover { color:#fff; background:#000; }
      .saresa-story__social a:focus-visible { outline:2px solid #000; outline-offset:3px; }
      .saresa-story__icon { display:grid; place-items:center; flex:0 0 54px; height:54px; background:#000; color:#fff; border:5px solid #fff; outline:1px solid #000; border-radius:50%; font-size:28px; }
      .saresa-story__contact:hover { color:#000; }
      a.saresa-story__contact:hover .saresa-story__icon { background:#fff; color:#000; }
      .saresa-story__contact:focus-visible { outline:2px solid #000; outline-offset:8px; }
      .saresa-story__about h2 { font-family:Arial,Helvetica,sans-serif!important; font-size:clamp(28px,3vw,40px); font-weight:400; margin:0 0 8px; color:#000; }
      .saresa-story__category { font-size:14px; color:#ad7527; margin-bottom:24px; letter-spacing:.08em; }
      .saresa-story__about p { color:#222; font-size:16px; line-height:1.8; margin:0 0 18px; }
      .saresa-story .brand-profile-actions { grid-column:1/-1; }
      @media(min-width:1001px) {
        .saresa-story { grid-template-columns:max-content minmax(0, 1fr); column-gap:clamp(24px,3vw,48px); padding-left:24px; padding-right:24px; }
        .saresa-story__contacts { margin-top:94px; text-align:left; }
        .saresa-story__contact > span:last-child { white-space:nowrap; overflow-wrap:normal; }
        .saresa-story__about h2 { line-height:54px; }
        .saresa-story__about { width:100%; max-width:720px; justify-self:center; }
      }
      @media(max-width:1000px) {
        .saresa-story { grid-template-columns:1fr; gap:0; }
        .saresa-story__logo { order:1; width:240px; height:200px; justify-self:start; object-position:left center; margin:0 0 20px; }
        .saresa-story__contacts { order:2; margin:0 0 36px; gap:24px 16px; }
        .saresa-story__about { order:3; }
        .saresa-story__contact { gap:12px; font-size:14px; }
        .saresa-story__icon { flex-basis:40px; height:40px; font-size:21px; }
        .saresa-story .brand-profile-actions { order:4; margin-top:28px; }
      }
      @media(max-width:768px) {
        .saresa-story { grid-template-columns:1fr; gap:0; padding:24px 6% 36px; border:0; }
        .saresa-story__logo { justify-self:center; object-position:center; margin:0 auto 22px; }
        .saresa-story__contacts { display:flex; width:100%; flex-direction:column; align-items:center; gap:16px; margin:0 0 28px; padding:0; border:0; text-align:center; }
        .saresa-story__contact { justify-content:center; gap:8px; padding:0; border:0; font-size:clamp(11px,3vw,14px); text-align:center; }
        .saresa-story__about { width:100%; margin:0; padding:0; border:0; text-align:left; }
        .saresa-story .brand-profile-actions { text-align:left; }
        .saresa-story__social { width:fit-content; max-width:100%; margin:14px auto 0; }
      }
      @media(min-width:1001px) {
        .basanti-story { row-gap:20px; padding-top:16px; }
        .basanti-story .saresa-story__logo { width:400px; height:130px; object-fit:contain; }
      }
      @media(max-width:1000px) {
        .basanti-story { padding-top:14px; }
        .basanti-story .saresa-story__logo { width:min(280px,calc(100vw - 40px)); height:auto; object-fit:contain; justify-self:center; object-position:center; margin:0 auto; }
        .basanti-story .saresa-story__contacts { margin-bottom:30px; }
      }
      .basanti-slider .saresa-slider__slide img { height:auto; aspect-ratio:2 / 3; object-fit:contain; background:#f7f6f4; }
      .basanti-slider .saresa-slider__slide { width:clamp(220px,27vw,440px); }
