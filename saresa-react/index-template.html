    <script>
    (function () {
      function isHomePath(pathname) {
        return pathname === "/" || /\/index\.html$/i.test(pathname);
      }

      function cleanHash() {
        if (window.location.hash && window.history.replaceState) {
          window.history.replaceState(null, "", window.location.pathname + window.location.search);
        }
      }

      function scrollToTarget(id) {
        var target = document.getElementById(id);
        if (target) {
          target.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      }

      cleanHash();

      document.addEventListener("click", function (event) {
        var link = event.target.closest ? event.target.closest("a[data-scroll-target]") : null;
        if (!link) {
          return;
        }
        var targetId = link.getAttribute("data-scroll-target");
        if (!targetId) {
          return;
        }
        if (isHomePath(window.location.pathname)) {
          event.preventDefault();
          scrollToTarget(targetId);
          if (window.history.replaceState) {
            window.history.replaceState(null, "", "/");
          }
        } else {
          try {
            window.sessionStorage.setItem("sindhScrollTarget", targetId);
          } catch (error) {}
        }
      });

      document.addEventListener("DOMContentLoaded", function () {
        var targetId = null;
        try {
          targetId = window.sessionStorage.getItem("sindhScrollTarget");
          window.sessionStorage.removeItem("sindhScrollTarget");
        } catch (error) {}
        if (targetId && isHomePath(window.location.pathname)) {
          window.setTimeout(function () {
            scrollToTarget(targetId);
          }, 100);
        }
      });
    })();
  </script>

<script>
    (function () {
      document.addEventListener("DOMContentLoaded", function () {
        var widget = document.getElementById("whatsappWidget");
        if (!widget) {
          return;
        }
        var dismiss = widget.querySelector("[data-whatsapp-dismiss]");
        var toggle = widget.querySelector("[data-whatsapp-toggle]");
        var autoCloseTimer = null;

        function clearAutoClose() {
          if (autoCloseTimer) {
            window.clearTimeout(autoCloseTimer);
            autoCloseTimer = null;
          }
        }

        function setOpen(isOpen) {
          clearAutoClose();
          widget.classList.toggle("is-open", isOpen);
          if (toggle) {
            toggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
          }
          if (isOpen) {
            autoCloseTimer = window.setTimeout(function () {
              setOpen(false);
            }, 2000);
          }
        }

        if (toggle) {
          toggle.addEventListener("click", function (event) {
            if (!widget.classList.contains("is-open")) {
              event.preventDefault();
              setOpen(true);
            }
          });
        }

        if (dismiss) {
          dismiss.addEventListener("click", function () {
            setOpen(false);
          });
        }

        document.addEventListener("click", function (event) {
          if (widget.classList.contains("is-open") && !widget.contains(event.target)) {
            setOpen(false);
          }
        });

        document.addEventListener("keydown", function (event) {
          if (event.key === "Escape") {
            setOpen(false);
          }
        });
      });
    })();

<script>
    (function () {
      var heroVideo = document.querySelector(".hero-video");

      }
      var activeSrc = "";

      function loadVideoSources() {
        var mobileSrc = heroVideo.getAttribute("data-mobile-src");
        var desktopSrc = heroVideo.getAttribute("data-desktop-src");
        var isAndroid = /Android/i.test(window.navigator.userAgent || "");
        var nextSrc =
          isAndroid || !window.matchMedia("(min-width: 901px)").matches
            ? mobileSrc
            : desktopSrc;
        if (nextSrc && activeSrc !== nextSrc) {
          activeSrc = nextSrc;
          heroVideo.setAttribute("src", nextSrc);
          Array.prototype.forEach.call(
            heroVideo.querySelectorAll("source"),
            function (source) {
              source.setAttribute("src", nextSrc);
            },
          );
          heroVideo.load();
        }
      }

      function tryPlayVideo() {
        loadVideoSources();
        heroVideo.muted = true;
        heroVideo.defaultMuted = true;
        var playPromise = heroVideo.play();
        if (playPromise && typeof playPromise.catch === "function") {
          playPromise.catch(function () {
            if (heroVideo.readyState >= 2) {
              markVideoVisible();

        heroVideo.classList.add("is-playing");
        var heroShell = heroVideo.closest(".hero--video");
        if (heroShell) {
          heroShell.classList.add("video-ready");

      heroVideo.muted = true;
      heroVideo.defaultMuted = true;
      heroVideo.setAttribute("muted", "");
      heroVideo.setAttribute("playsinline", "");
      heroVideo.setAttribute("webkit-playsinline", "");

      function scheduleVideoLoad() {
        loadVideoSources();
        document.addEventListener("touchstart", tryPlayVideo, { once: true, passive: true });
        document.addEventListener("pointerdown", tryPlayVideo, { once: true, passive: true });
        document.addEventListener("mousemove", tryPlayVideo, { once: true, passive: true });
        window.addEventListener("scroll", tryPlayVideo, { once: true, passive: true });

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", scheduleVideoLoad, { once: true });

        scheduleVideoLoad();

      window.addEventListener("resize", loadVideoSources, { passive: true });
      window.addEventListener("orientationchange", tryPlayVideo);

          if (maxScroll > 0) {
            self.container.scrollLeft = ((self.container.scrollLeft + direction * distance) % maxScroll + maxScroll) % maxScroll;
            self.snapScroll();
          }
          self.stopInteraction();
        });
        shell.appendChild(button);
      });
    };

    InteractiveMarquee.prototype.snapScroll = function () {
      var maxScroll = this.getMaxScroll();
      if (maxScroll <= 0) {
        return;
      }
      var current = this.container.scrollLeft;
      if (current >= maxScroll) {
        this.container.scrollLeft = current - maxScroll;
      } else if (current <= 0) {
        this.container.scrollLeft = current + maxScroll;
      }
    };

    InteractiveMarquee.prototype.animate = function (time) {
      if (
        !this.isInteracting &&
        !this.isDown &&
        !this.container.classList.contains("is-paused") &&
        !this.container.classList.contains("is-offscreen")
      ) {
        var delta = time - this.lastTime;
        var speedPxPerMs = (this.autoSpeed * 60) / 1000;
        var amount = speedPxPerMs * delta;
        var direction = this.isReverse ? -1 : 1;
        this.container.scrollLeft += amount * direction;
        this.snapScroll();
      }
      this.lastTime = time;
    };

    InteractiveMarquee.prototype.startInteraction = function () {
      this.isInteracting = true;
      window.clearTimeout(this.interactionTimeout);
    };

    InteractiveMarquee.prototype.stopInteraction = function () {
      var self = this;
      window.clearTimeout(this.interactionTimeout);
      this.interactionTimeout = window.setTimeout(function () {
        self.isInteracting = false;
        self.lastTime = performance.now();
      }, 1500);
    };

    InteractiveMarquee.prototype.initEvents = function () {
      var self = this;

      this.container.addEventListener("pointerdown", function (e) {
        if (e.pointerType === "mouse" && e.button !== 0) {
          return;
        }
        self.isDown = true;
        self.dragged = false;
        self.draggedDistance = 0;
        // self.container.classList.add("is-dragging");
        
        try {
          self.container.setPointerCapture(e.pointerId);
        } catch (err) {}

        self.startX = e.clientX;
        self.scrollLeftStart = self.container.scrollLeft;
        self.startInteraction();
      });

      this.container.addEventListener("pointermove", function (e) {
        if (!self.isDown) {
          return;
        }
        var deltaX = e.clientX - self.startX;
        self.draggedDistance = Math.abs(deltaX);
        if (self.draggedDistance > 5) {
          self.dragged = true;
          self.container.classList.add("is-dragging");
        }
        var walk = deltaX * 1.2;
        self.container.scrollLeft = self.scrollLeftStart - walk;
        self.snapScroll();
      });

      function handlePointerUp(e) {
        if (!self.isDown) {
          return;
        }
        self.isDown = false;
        self.container.classList.remove("is-dragging");
        try {
          self.container.releasePointerCapture(e.pointerId);
        } catch (err) {}
        self.stopInteraction();
      }

      this.container.addEventListener("pointerup", handlePointerUp);
      this.container.addEventListener("pointercancel", handlePointerUp);
      this.container.addEventListener("pointerleave", handlePointerUp);

      // Prevent link clicking if dragging happened
      this.container.addEventListener("click", function (e) {
        if (self.dragged) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, true);

      // Keep snapping in sync with manual scrolling/momentum
      this.container.addEventListener("scroll", function () {
        self.snapScroll();
      });

      this.container.addEventListener("touchstart", function () {
        self.startInteraction();
      }, { passive: true });

      this.container.addEventListener("touchend", function () {
        self.stopInteraction();
      }, { passive: true });
    };

      new InteractiveMarquee(".hero-slider", ".hero-slider-track", 1.45);
    })();

    //noinspection SpellCheckingInspection
    (function () {
      var menuTrigger = document.getElementById("menuTrigger");
      var menuPanel = document.getElementById("menuPanel");
      var menuContent = menuPanel
        ? menuPanel.querySelector(".menu-content")
        : null;
      var menuText = menuTrigger
        ? menuTrigger.querySelector(".menu-text")
        : null;

      if (!menuTrigger || !menuPanel) {
        return;
      }

      function openMenu() {
        menuPanel.hidden = false;
        menuTrigger.setAttribute("aria-expanded", "true");
        menuTrigger.setAttribute("aria-label", "Close menu");
        if (menuText) {
          menuText.textContent = "CLOSE";
        }
        document.body.classList.add("menu-open");
      }

      function closeMenu() {
        menuPanel.hidden = true;
        menuTrigger.setAttribute("aria-expanded", "false");
        menuTrigger.setAttribute("aria-label", "Open menu");
        if (menuText) {
          menuText.textContent = "MENU";
        }
        document.body.classList.remove("menu-open");
      }

      menuTrigger.addEventListener("click", function () {
        var isExpanded = menuTrigger.getAttribute("aria-expanded") === "true";
        if (isExpanded) {
          closeMenu();
          return;
        }
        openMenu();
      });

      document.addEventListener("click", function (event) {
        var target = event.target;
        if (menuPanel.hidden) {
          return;
        }
        if (menuTrigger.contains(target)) {
          return;
        }
        if (menuContent && menuContent.contains(target)) {
          return;
        }
        closeMenu();
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          closeMenu();
        }
      });

      Array.prototype.forEach.call(
        menuPanel.querySelectorAll("a"),
        function (link) {
          link.addEventListener("click", closeMenu);
        },
      );
    })();

    (function () {
      var aboutToggle = document.getElementById("aboutToggle");
      var aboutMore = document.getElementById("aboutMore");

      if (!aboutToggle || !aboutMore) {
        return;
      }

      function setExpanded(expanded) {
        aboutMore.hidden = !expanded;
        aboutToggle.setAttribute(
          "aria-expanded",
          expanded ? "true" : "false",
        );
        aboutToggle.textContent = expanded ? "READ LESS" : "READ MORE";
      }

      aboutToggle.addEventListener("click", function () {
        var isExpanded = aboutToggle.getAttribute("aria-expanded") === "true";
        setExpanded(!isExpanded);
      });
    })();

    //noinspection SpellCheckingInspection
    (function () {
      var prefersReducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      ).matches;

      function runWhenIdle(task) {
        if ("requestIdleCallback" in window) {
          window.requestIdleCallback(task, { timeout: 2000 });
        } else {
          window.setTimeout(task, 700);
        }
      }

      runWhenIdle(function () {
        var heroWord = document.getElementById("heroWord");
        var heroWords = ["Heritage", "Legacy", "Craft"];
        var heroIndex = 0;
        if (heroWord && !prefersReducedMotion) {
          setInterval(function () {
            heroWord.classList.add("fade");
            setTimeout(function () {
              heroIndex = (heroIndex + 1) % heroWords.length;
              heroWord.textContent = heroWords[heroIndex];
              heroWord.classList.remove("fade");
            }, 260);
          }, 3200);
        }

        var localTimeEl = document.getElementById("localTime");
        var openStatusEl = document.getElementById("openStatus");
        var openCountdownEl = document.getElementById("openCountdown");
        var storeHoursEl = document.getElementById("storeHours");
        var conciergeStatusEl = document.getElementById("conciergeStatus");
        var conciergeHoursEl = document.getElementById("conciergeHours");
        var liveFlagEl = document.getElementById("liveFlag");

        var storeSchedule = { open: 11, close: 21 };
        var conciergeSchedule = { open: 12, close: 20 };

        function formatSchedule(schedule) {
          var openTime = new Date();
          openTime.setHours(schedule.open, 0, 0, 0);
          var closeTime = new Date();
          closeTime.setHours(schedule.close, 0, 0, 0);
          var timeFormat = new Intl.DateTimeFormat("en-IN", {
            hour: "numeric",
            minute: "2-digit",
          });
          return (
            timeFormat.format(openTime) + " - " + timeFormat.format(closeTime)
          );
        }

        function updateScheduleLabels() {
          if (storeHoursEl) {
            storeHoursEl.textContent = formatSchedule(storeSchedule);
          }
          if (conciergeHoursEl) {
            conciergeHoursEl.textContent =
              "Concierge hours: " + formatSchedule(conciergeSchedule);
          }
        }

        function updateStatus(nowDate, schedule, statusEl, countdownEl) {
          if (!statusEl) {
            return;
          }
          var openTime = new Date(nowDate);
          openTime.setHours(schedule.open, 0, 0, 0);
          var closeTime = new Date(nowDate);
          closeTime.setHours(schedule.close, 0, 0, 0);
          var isOpen = nowDate >= openTime && nowDate < closeTime;
          statusEl.textContent = isOpen ? "Open Now" : "Closed";
          statusEl.classList.toggle("is-open", isOpen);
          statusEl.classList.toggle("is-closed", !isOpen);

          if (countdownEl) {
            var diff = 0;
            if (isOpen) {
              diff = closeTime - nowDate;
              countdownEl.textContent = "Closes in " + formatDuration(diff);
            } else {
              if (nowDate >= closeTime) {
                openTime.setDate(openTime.getDate() + 1);
              }
              diff = openTime - nowDate;
              countdownEl.textContent = "Opens in " + formatDuration(diff);
            }
          }
        }

        function updateLivePanel() {
          var nowDate = new Date();
          if (localTimeEl) {
            localTimeEl.textContent = new Intl.DateTimeFormat("en-IN", {
              weekday: "long",
              day: "2-digit",
              month: "long",
              year: "numeric",
              hour: "numeric",
              minute: "2-digit",
            }).format(nowDate);
          }
          if (liveFlagEl) {
            liveFlagEl.textContent =
              "Updated " +
              new Intl.DateTimeFormat("en-IN", {
                hour: "numeric",
                minute: "2-digit",
              }).format(nowDate);
          }
          updateStatus(nowDate, storeSchedule, openStatusEl, openCountdownEl);
          updateStatus(nowDate, conciergeSchedule, conciergeStatusEl);
        }

        updateScheduleLabels();
        updateLivePanel();
        setInterval(updateLivePanel, 60000);

        var revealObserver = null;

        function observeReveals() {
          if (!("IntersectionObserver" in window)) {
            return;
          }
          if (!revealObserver) {
            revealObserver = new IntersectionObserver(
              function (entries) {
                entries.forEach(function (entry) {
                  if (entry.isIntersecting) {
                    entry.target.classList.add("is-visible");
                    revealObserver.unobserve(entry.target);
                  }
                });
              },
              { threshold: 0.2 },
            );
          }
          Array.prototype.forEach.call(
            document.querySelectorAll("[data-reveal]:not(.is-visible)"),
            function (el) {
              revealObserver.observe(el);
            },
          );
        }

        observeReveals();

        var statObserver = null;

        function animateCount(el) {
          var target = Number(el.getAttribute("data-count"));
          if (!target) {
            return;
          }
          var duration = 1200;
          var start = null;
          function step(timestamp) {
            if (!start) {
              start = timestamp;
            }
            var progress = Math.min((timestamp - start) / duration, 1);
            var value = Math.floor(progress * target);
            el.textContent = value.toLocaleString("en-IN");
            if (progress < 1) {
              window.requestAnimationFrame(step);
            }
          }
          window.requestAnimationFrame(step);
        }

        function observeStats() {
          if (!("IntersectionObserver" in window)) {
            return;
          }
          if (!statObserver) {
            statObserver = new IntersectionObserver(
              function (entries) {
                entries.forEach(function (entry) {
                  if (entry.isIntersecting) {
                    animateCount(entry.target);
                    statObserver.unobserve(entry.target);
                  }
                });
              },
              { threshold: 0.6 },
            );
          }
          Array.prototype.forEach.call(
            document.querySelectorAll("[data-count]"),
            function (el) {
              statObserver.observe(el);
            },
          );
        }

        observeStats();
      });
    })();
  </script>
<script>
    (function () {
      document.addEventListener("DOMContentLoaded", function () {
        var dropdownItems = document.querySelectorAll(".main-nav .nav-item--has-dropdown");
        if (!dropdownItems.length) {
          return;
        }

        function setOpen(item, isOpen) {
          var trigger = item.querySelector("a[aria-haspopup='true']");
          item.classList.toggle("is-open", isOpen);
          if (trigger) {
            trigger.setAttribute("aria-expanded", isOpen ? "true" : "false");
          }
        }

        function closeAll(exceptItem) {
          Array.prototype.forEach.call(dropdownItems, function (item) {
            if (item !== exceptItem) {
              setOpen(item, false);
            }
          });
        }

        Array.prototype.forEach.call(dropdownItems, function (item) {
          var trigger = item.querySelector("a[aria-haspopup='true']");
          if (!trigger) {
            return;
          }

          trigger.addEventListener("click", function (event) {
            closeAll();
          });

          trigger.addEventListener("focus", function () {
            closeAll(item);
            setOpen(item, true);
          });
        });

        document.addEventListener("click", function (event) {
          if (!event.target.closest || !event.target.closest(".main-nav .nav-item--has-dropdown")) {
            closeAll();
          }
        });

        document.addEventListener("keydown", function (event) {
          if (event.key === "Escape") {
            closeAll();
          }
        });
      });
    })();
  </script>
