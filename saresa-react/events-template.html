    <div id="events-root">{{APP}}</div>
    <script>
    (function () {
      document.addEventListener("DOMContentLoaded", function () {
        var widget = document.getElementById("whatsappWidget");
        if (!widget) {
          return;
        }
        var dismiss = widget.querySelector("[data-whatsapp-dismiss]");
        var toggle = widget.querySelector("[data-whatsapp-toggle]");
        var autoCloseTimer = null;

        function clearAutoClose() {
          if (autoCloseTimer) {
            window.clearTimeout(autoCloseTimer);
            autoCloseTimer = null;
          }
        }

        function setOpen(isOpen) {
          clearAutoClose();
          widget.classList.toggle("is-open", isOpen);
          if (toggle) {
            toggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
          }
          if (isOpen) {
            autoCloseTimer = window.setTimeout(function () {
              setOpen(false);
            }, 2000);
          }
        }

        if (toggle) {
          toggle.addEventListener("click", function (event) {
            if (!widget.classList.contains("is-open")) {
              event.preventDefault();
              setOpen(true);
            }
          });
        }

        if (dismiss) {
          dismiss.addEventListener("click", function () {
            setOpen(false);
          });
        }

        document.addEventListener("click", function (event) {
          if (widget.classList.contains("is-open") && !widget.contains(event.target)) {
            setOpen(false);
          }
        });

        document.addEventListener("keydown", function (event) {
          if (event.key === "Escape") {
            setOpen(false);
          }
        });
      });
    })();
  </script>
<script>
      (function () {
        var menuTrigger = document.getElementById("menuTrigger");
        var menuPanel = document.getElementById("menuPanel");
        var menuContent = menuPanel
          ? menuPanel.querySelector(".menu-content")
          : null;
        var menuText = menuTrigger
          ? menuTrigger.querySelector(".menu-text")
          : null;

        if (!menuTrigger || !menuPanel) {
          return;
        }

        function openMenu() {
          menuPanel.hidden = false;
          menuTrigger.setAttribute("aria-expanded", "true");
          menuTrigger.setAttribute("aria-label", "Close menu");
          if (menuText) {
            menuText.textContent = "CLOSE";
          }
          document.body.classList.add("menu-open");
        }

        function closeMenu() {
          menuPanel.hidden = true;
          menuTrigger.setAttribute("aria-expanded", "false");
          menuTrigger.setAttribute("aria-label", "Open menu");
          if (menuText) {
            menuText.textContent = "MENU";
          }
          document.body.classList.remove("menu-open");
        }

        menuTrigger.addEventListener("click", function () {
          var isExpanded = menuTrigger.getAttribute("aria-expanded") === "true";
          if (isExpanded) {
            closeMenu();
            return;
          }
          openMenu();
        });

        document.addEventListener("click", function (event) {
          var target = event.target;
          if (menuPanel.hidden) {
            return;
          }
          if (menuTrigger.contains(target)) {
            return;
          }
          if (menuContent && menuContent.contains(target)) {
            return;
          }
          closeMenu();
        });

        document.addEventListener("keydown", function (event) {
          if (event.key === "Escape") {
            closeMenu();
          }
        });

        Array.prototype.forEach.call(
          menuPanel.querySelectorAll("a"),
          function (link) {
            link.addEventListener("click", closeMenu);
          },
        );
      })();

      (function () {
        var socialLinks = document.querySelectorAll(
          '.social-icons a[target="_blank"]',
        );
        if (!socialLinks.length) {
          return;
        }

        Array.prototype.forEach.call(socialLinks, function (link) {
          link.addEventListener("click", function (event) {
            var newWindow = window.open(link.href, "_blank", "noopener");
            if (newWindow) {
              newWindow.opener = null;
              event.preventDefault();
            }
          });
        });
      })();

      (function () {
        var sliders = document.querySelectorAll("[data-slider]");
        if (!sliders.length) {
          return;
        }

        var prefersReduced =
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        Array.prototype.forEach.call(sliders, function (slider) {
          var slides = slider.querySelectorAll(".event-slider__slide");
          if (slides.length < 2) {
            return;
          }

          var interval = parseInt(slider.getAttribute("data-interval"), 10);
          if (!interval || interval < 2000) {
            interval = 4200;
          }

          var index = 0;
          Array.prototype.forEach.call(slides, function (slide, idx) {
            slide.classList.toggle("is-active", idx === 0);
          });

          if (prefersReduced) {
            return;
          }

          setInterval(function () {
            slides[index].classList.remove("is-active");
            index = (index + 1) % slides.length;
            slides[index].classList.add("is-active");
          }, interval);
        });
      })();

      (function () {
        var previewLimit = 6;
        var collages = document.querySelectorAll(".event-collage");
        var modal = document.getElementById("eventGalleryModal");
        var modalTitle = document.getElementById("eventGalleryTitle");
        var viewer = document.getElementById("eventGalleryViewer");
        var galleryImage = document.getElementById("eventGalleryImage");
        var galleryMeta = document.getElementById("eventGalleryMeta");
        var prevButton = document.getElementById("eventGalleryPrev");
        var nextButton = document.getElementById("eventGalleryNext");
        var closeElements = modal
          ? modal.querySelectorAll("[data-gallery-close]")
          : [];
        var closeButton = modal
          ? modal.querySelector(".event-gallery-modal__close")
          : null;
        var lastFocusedElement = null;
        var activeImages = [];
        var activeIndex = 0;
        var touchStartX = 0;
        var touchInProgress = false;

        if (
          !collages.length ||
          !modal ||
          !modalTitle ||
          !viewer ||
          !galleryImage ||
          !galleryMeta ||
          !prevButton ||
          !nextButton ||
          !closeElements.length
        ) {
          return;
        }

        function setGalleryTitle(collage) {
          var explicitTitle = collage.getAttribute("data-gallery-title");
          if (explicitTitle) {
            modalTitle.textContent = explicitTitle;
            return;
          }

          var eventInfo = collage.closest(".event-info");
          var heading = eventInfo ? eventInfo.querySelector("h3") : null;
          modalTitle.textContent = heading
            ? heading.textContent.trim()
            : "Event Gallery";
        }

        function updateNavState() {
          var disableNav = activeImages.length < 2;
          prevButton.disabled = disableNav;
          nextButton.disabled = disableNav;
        }

        function renderActiveImage() {
          if (!activeImages.length) {
            return;
          }

          var sourceImage = activeImages[activeIndex];
          galleryImage.src = sourceImage.currentSrc || sourceImage.src;
          galleryImage.alt =
            sourceImage.alt || "Event photo " + (activeIndex + 1);
          galleryMeta.textContent =
            activeIndex + 1 + " / " + activeImages.length;
          updateNavState();
        }

        function showImage(index) {
          if (!activeImages.length) {
            return;
          }

          if (index < 0) {
            index = activeImages.length - 1;
          } else if (index >= activeImages.length) {
            index = 0;
          }

          activeIndex = index;
          renderActiveImage();
        }

        function openGallery(collage, startIndex, trigger) {
          activeImages = Array.prototype.slice.call(
            collage.querySelectorAll(".event-collage__item img"),
          );

          if (!activeImages.length) {
            return;
          }

          activeIndex = Math.min(
            Math.max(startIndex || 0, 0),
            activeImages.length - 1,
          );
          setGalleryTitle(collage);
          renderActiveImage();
          modal.hidden = false;
          document.body.classList.add("event-gallery-open");
          lastFocusedElement = trigger || document.activeElement;

          if (closeButton) {
            closeButton.focus();
          }
        }

        function closeGallery() {
          if (modal.hidden) {
            return;
          }

          modal.hidden = true;
          document.body.classList.remove("event-gallery-open");
          activeImages = [];
          activeIndex = 0;
          galleryImage.removeAttribute("src");
          galleryImage.alt = "";
          galleryMeta.textContent = "";

          if (
            lastFocusedElement &&
            typeof lastFocusedElement.focus === "function"
          ) {
            lastFocusedElement.focus();
          }
        }

        Array.prototype.forEach.call(collages, function (collage) {
          var items = collage.querySelectorAll(".event-collage__item");
          var hiddenCount = items.length - previewLimit;
          var customLabel = collage.getAttribute("data-more-label");
          var previewAnchor = items[previewLimit - 1];

          Array.prototype.forEach.call(items, function (item, index) {
            item.setAttribute("role", "button");
            item.setAttribute("tabindex", "0");
            item.setAttribute(
              "aria-label",
              "Open photo " + (index + 1) + " of " + items.length,
            );
            item.addEventListener("click", function (event) {
              if (event.target.closest(".event-collage__more")) {
                return;
              }
              openGallery(collage, index, item);
            });
            item.addEventListener("keydown", function (event) {
              if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                openGallery(collage, index, item);
              }
            });
            item.hidden = hiddenCount > 0 && index >= previewLimit;
          });

          if (hiddenCount <= 0) {
            return;
          }

          var trigger = document.createElement("button");
          trigger.type = "button";
          trigger.className = "event-collage__more";
          trigger.textContent = customLabel || "+" + hiddenCount + " more";
          trigger.setAttribute(
            "aria-label",
            "Open gallery with " + items.length + " photos",
          );
          trigger.addEventListener("click", function (event) {
            event.stopPropagation();
            openGallery(collage, previewLimit, trigger);
          });

          if (previewAnchor) {
            previewAnchor.classList.add("event-collage__item--more");
            previewAnchor.appendChild(trigger);
          }
        });

        Array.prototype.forEach.call(closeElements, function (element) {
          element.addEventListener("click", closeGallery);
        });

        prevButton.addEventListener("click", function () {
          showImage(activeIndex - 1);
        });

        nextButton.addEventListener("click", function () {
          showImage(activeIndex + 1);
        });

        viewer.addEventListener("touchstart", function (event) {
          if (!event.touches || event.touches.length !== 1) {
            return;
          }
          touchStartX = event.touches[0].clientX;
          touchInProgress = true;
        });

        viewer.addEventListener("touchend", function (event) {
          if (!touchInProgress || !event.changedTouches || !event.changedTouches.length) {
            return;
          }

          var touchEndX = event.changedTouches[0].clientX;
          var deltaX = touchEndX - touchStartX;
          touchInProgress = false;

          if (Math.abs(deltaX) < 36) {
            return;
          }

          if (deltaX > 0) {
            showImage(activeIndex - 1);
            return;
          }

          showImage(activeIndex + 1);
        });

        document.addEventListener("keydown", function (event) {
          if (modal.hidden) {
            return;
          }

          if (event.key === "Escape") {
            closeGallery();
            return;
          }

          if (event.key === "ArrowLeft") {
            event.preventDefault();
            showImage(activeIndex - 1);
            return;
          }

          if (event.key === "ArrowRight") {
            event.preventDefault();
            showImage(activeIndex + 1);
          }
        });
      })();
    </script>
<script>
    (function () {
      document.addEventListener("DOMContentLoaded", function () {
        var dropdownItems = document.querySelectorAll(".main-nav .nav-item--has-dropdown");
        if (!dropdownItems.length) {
          return;
        }

        function setOpen(item, isOpen) {
          var trigger = item.querySelector("a[aria-haspopup='true']");
          item.classList.toggle("is-open", isOpen);
          if (trigger) {
            trigger.setAttribute("aria-expanded", isOpen ? "true" : "false");
          }
        }

        function closeAll(exceptItem) {
          Array.prototype.forEach.call(dropdownItems, function (item) {
            if (item !== exceptItem) {
              setOpen(item, false);
            }
          });
        }

        Array.prototype.forEach.call(dropdownItems, function (item) {
          var trigger = item.querySelector("a[aria-haspopup='true']");
          if (!trigger) {
            return;
          }

          trigger.addEventListener("click", function (event) {
            event.preventDefault();
            var willOpen = !item.classList.contains("is-open");
            closeAll(item);
            setOpen(item, willOpen);
          });

          trigger.addEventListener("focus", function () {
            closeAll(item);
            setOpen(item, true);
          });
        });

        document.addEventListener("click", function (event) {
          if (!event.target.closest || !event.target.closest(".main-nav .nav-item--has-dropdown")) {
            closeAll();
          }
        });

        document.addEventListener("keydown", function (event) {
          if (event.key === "Escape") {
            closeAll();
          }
        });
      });
    })();
  </script>
